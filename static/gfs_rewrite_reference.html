
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LFTR GFS</title>
<style>
html,body{margin:0;height:100%;background:black}
gmp-map-3d{width:100%;height:100%}
#layerPills{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
z-index:1000;
}
.pill{
padding:6px 14px;
border-radius:20px;
background:rgba(0,0,0,.6);
color:white;
border:1px solid rgba(255,255,255,.3);
cursor:pointer;
}
.pill.active{background:rgba(0,140,255,.8);}
</style>

<script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=maps3d"></script>
</head>

<body>

<gmp-map-3d center="34,-118" tilt="60" range="15000000"></gmp-map-3d>

<div id="layerPills">
<button class="pill" data-layer="clouds">Clouds</button>
<button class="pill" data-layer="rain">Rain</button>
<button class="pill" data-layer="jetstream">Jetstream</button>
<button class="pill" data-layer="bait">Bait</button>
<button class="pill" data-layer="boater">Boater</button>
</div>

<script type="module" src="/static/js/gfs/main.js"></script>

</body>
</html>
